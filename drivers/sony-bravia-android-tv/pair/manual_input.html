<main class="hy-tmpl-manual-input">
  <div class="hy-tmpl-manual-input-image"></div>
  <div class="hy-tmpl-manual-input-row">
    <p data-i18n="manual_input.intro"></p>
  </div>
  <form class="hy-tmpl-manual-input-form">
    <div class="hy-tmpl-manual-input-row">
      <label class="homey-form-label" for="ip_address" data-i18n="manual_input.inputs.ip_address.label"></label>
    </div>
    <div class="hy-tmpl-manual-input-row">
      <input class="homey-form-input" type="text" id="ip_address" name="ipAddress"
        data-i18n="[placeholder]manual_input.inputs.ip_address.placeholder" required />
    </div>

    <div class="hy-tmpl-manual-input-row">
      <label class="homey-form-label" for="preshared_key" data-i18n="manual_input.inputs.preshared_key.label"></label>
    </div>
    <div class="hy-tmpl-manual-input-row">
      <input class="homey-form-input" type="password" id="preshared_key" name="psk"
        data-i18n="[placeholder]manual_input.inputs.preshared_key.placeholder" required />
    </div>

    <div class="hy-tmpl-manual-input-row hy-tmpl-manual-input-checkbox">
      <label class="homey-form-checkbox">
        <input class="homey-form-checkbox-input" type="checkbox" id="https" name="https" />
        <span class="homey-form-checkbox-checkmark"></span>
        <span class="homey-form-checkbox-text" data-i18n="manual_input.inputs.https.label"></span>
      </label>
    </div>

    <div class="hy-tmpl-manual-input-row">
      <label class="homey-form-label" for="mac_address" data-i18n="manual_input.inputs.mac_address.label"></label>
    </div>
    <div class="hy-tmpl-manual-input-row">
      <input class="homey-form-input" type="text" id="mac_address" name="macAddress"
        data-i18n="[placeholder]manual_input.inputs.mac_address.placeholder" />
    </div>
    <div class="hy-tmpl-manual-input-row">
      <p class="hy-tmpl-manual-input-hint" data-i18n="manual_input.inputs.mac_address.hint"></p>
    </div>

    <div class="homey-form-group">
      <button class="homey-button-primary-full" type="submit"
        data-i18n="manual_input.buttons.next"></button>
      <br>
      <button class="homey-button-secondary-shadow-full" type="button"
        onclick="sonyBraviaAndroidTvManualInput.onClickInstructions()"
        data-i18n="manual_input.buttons.instructions"></button>
    </div>
  </form>
</main>

<script type="text/javascript">
  class SonyBraviaAndroidTvManualInput {
    constructor() {
      Homey.setTitle(Homey.__('manual_input.title'));

      const form = document.querySelector('form');
      form.addEventListener('submit', e => this.onSubmit(e));
    }

    onClickInstructions() {
      Homey.setViewStoreValue('instructions', 'previous_view', 'manual_input', () => {
        Homey.showView('instructions');
      });
    }

    onSubmit(e) {
      e.preventDefault();

      const formData = new FormData(e.target);
      const data = {
        ipAddress: formData.get('ipAddress'),
        psk: formData.get('psk'),
        https: formData.get('https') === 'on',
        macAddress: formData.get('macAddress')
      };

      Homey.showLoadingOverlay();
      Homey.emit('pair_device', data, async (err, device) => {
        if (err) {
          Homey.hideLoadingOverlay();
          return Homey.alert(err.message);
        }
        if (device === undefined) {
          Homey.hideLoadingOverlay();
          return;
        }

        try {
          await Homey.createDevice(device);
          Homey.hideLoadingOverlay();
          Homey.done();
        } catch (createErr) {
          Homey.hideLoadingOverlay();
          return Homey.alert(createErr.message);
        }
      });
    }
  }

  const sonyBraviaAndroidTvManualInput = new SonyBraviaAndroidTvManualInput();
</script>

<style>
  #hy-views>.hy-view {
    overflow: initial !important;
  }

  .hy-tmpl-manual-input {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hy-tmpl-manual-input-image {
    display: block;
    position: relative;
    width: 25vw;
    height: 25vw;
    margin: 8vw auto;
    background-image: url('assets/images/manual-icon.svg');
    background-position: center center;
    background-repeat: no-repeat;
    background-size: contain;
  }

  .hy-tmpl-manual-input-form {
    position: relative;
    width: 100%;
  }

  .hy-tmpl-manual-input-row {
    margin-bottom: 1em;
  }

  .hy-tmpl-manual-input-hint {
    font-size: 12px;
    opacity: 0.8;
    margin: 0;
  }

  .hy-tmpl-manual-input-checkbox {
    margin-bottom: 1.5em;
  }
</style>
